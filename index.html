<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONTENEGRO - TexGo Colombia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Bell MT', 'Playfair Display', 'Times New Roman', serif;
        }

        /* Contenedor del Póster Principal */
        .poster {
            position: relative;
            width: 100%;
            max-width: 850px;
            aspect-ratio: 1 / 1.37;
            background-image: url('montenegro_bg.png');
            background-size: cover;
            background-position: center top;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.85);
        }

        /* Logo TexGo (Restaurado a su estilo limpio original) */
        .logo {
            position: absolute !important;
            top: -3.5% !important;
            right: -4% !important;
            width: 32% !important;
            max-width: 260px !important;
            z-index: 20 !important;
            filter: drop-shadow(2px 4px 8px rgba(0, 0, 0, 0.55));
        }

        .logo img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* Bloque de Información Alineado a la Izquierda */
        .info-block {
            position: absolute !important;
            top: 7% !important;
            left: 4% !important;
            z-index: 10 !important;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        .title-container {
            display: flex;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        /* Título MONTENEGRO más pequeño */
        .title {
            font-family: 'Bell MT', 'Playfair Display', serif;
            font-size: clamp(2rem, 5.2vw, 4.2rem);
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #ffffff;
            line-height: 0.9;
            text-shadow: 2px 4px 12px rgba(0, 0, 0, 0.85);
        }

        /* Cuadro Compacto y Ultra-Translúcido */
        .info-details-card {
            background: rgba(10, 10, 10, 0.08);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            padding: 5px 10px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 3px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            margin-top: 4px;
        }

        .composition {
            font-family: 'Bell MT', 'Playfair Display', serif;
            font-size: clamp(0.65rem, 1.3vw, 0.98rem);
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.08em;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.85);
            line-height: 1.25;
        }

        .specs {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            align-items: flex-start;
        }

        .spec-text {
            font-family: 'Bell MT', 'Playfair Display', serif;
            font-size: clamp(0.65rem, 1.3vw, 0.98rem);
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.07em;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.85);
            white-space: nowrap;
        }

        /* Contenedor de Botones Inferiores */
        .buttons-container {
            position: absolute;
            bottom: 6%;
            left: 4%;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-start;
        }

        .btn-action {
            background: rgba(10, 10, 10, 0.88);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 10px 22px;
            font-family: 'Bell MT', 'Playfair Display', serif;
            font-size: clamp(0.8rem, 1.5vw, 1.1rem);
            font-weight: 600;
            letter-spacing: 0.15em;
            cursor: pointer;
            backdrop-filter: blur(6px);
            border-radius: 4px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45);
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-action:hover {
            background: #ffffff;
            color: #0a0a0a;
            border-color: #0a0a0a;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.55);
        }

        /* Modales Base */
        .modal {
            position: absolute;
            inset: 0;
            z-index: 50;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-title {
            color: #ffffff;
            font-family: 'Bell MT', 'Playfair Display', serif;
            font-size: clamp(1.6rem, 3.5vw, 2.5rem);
            font-weight: 600;
            letter-spacing: 0.1em;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Grid de Colores Estructurado en 3 - 3 - 1 */
        .colors-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 520px;
            max-height: 65vh;
            overflow-y: auto;
            padding: 10px;
        }

        .color-card {
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            transition: transform 0.25s ease;
        }

        .color-card:hover {
            transform: translateY(-5px);
        }

        /* Tarjeta Centrada en la 3ra Fila (Negro) */
        .color-card.color-center {
            grid-column: 2 / span 1;
        }

        .color-box {
            height: 85px;
            width: 100%;
            border: 1px solid rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        .color-name {
            padding: 8px 4px;
            text-align: center;
            font-family: 'Bell MT', 'Playfair Display', serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: #0a0a0a;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Grid de Ideas de Confección */
        .outfits-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            width: 100%;
            max-width: 740px;
            max-height: 68vh;
            overflow-y: auto;
            padding: 10px;
        }

        .outfit-card {
            position: relative;
            background: #0d0d0d;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            aspect-ratio: 9 / 16;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .outfit-card:hover {
            transform: scale(1.03);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .outfit-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.2s ease, object-position 0.2s ease;
        }

        .outfit-card.outfit-2 img {
            transform: scale(1.07);
        }

        .outfit-card.outfit-3 img {
            transform: scale(0.95) translateY(-3%);
            object-position: center 0%;
        }

        /* --- ETIQUETAS Y LÍNEAS ULTRAFINAS EDITORIALES --- */
        .badge-editorial {
            position: absolute;
            z-index: 20;
            background: rgba(0, 0, 0, 0.9);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 2px 5px;
            font-family: 'Bell MT', 'Playfair Display', serif;
            font-size: clamp(0.42rem, 0.6vw, 0.55rem);
            font-weight: 700;
            letter-spacing: 0.1em;
            border-radius: 2px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.9);
            white-space: nowrap;
            pointer-events: none;
        }

        .pointer-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            pointer-events: none;
        }

        .pointer-svg polyline {
            stroke: rgba(255, 255, 255, 0.85);
            stroke-width: 0.35;
            stroke-dasharray: 1.5,1.5;
            fill: none;
        }

        .pointer-svg circle {
            fill: #ffffff;
        }

        .btn-close {
            margin-top: 20px;
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 8px 26px;
            font-family: 'Bell MT', 'Playfair Display', serif;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.25s ease;
            border-radius: 4px;
        }

        .btn-close:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ffffff;
        }

        /* AJUSTES ESPECÍFICOS PARA DISPOSITIVOS MÓVILES */
        @media (max-width: 600px) {
            body {
                padding: 0;
            }
            .poster {
                box-shadow: none;
            }
            .logo {
                width: 36% !important;
                top: -3% !important;
                right: -3% !important;
            }
            .info-block {
                left: 4% !important;
                top: 4% !important;
            }
            .info-details-card {
                padding: 3px 6px;
            }
            .buttons-container {
                left: 4% !important;
                bottom: 4% !important;
            }
            .colors-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
                max-width: 100%;
            }
            .outfits-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
                padding: 5px;
            }
            .badge-editorial {
                font-size: 0.35rem !important;
                padding: 1px 3px !important;
                border-width: 0.5px !important;
                letter-spacing: 0.04em !important;
            }
            .pointer-svg polyline {
                stroke-width: 0.25 !important;
                stroke-dasharray: 1,1 !important;
            }
            .pointer-svg circle {
                r: 0.5 !important;
            }
        }
    </style>
</head>
<body>

    <div class="poster">
        <!-- Logo TexGo en la esquina superior derecha -->
        <div class="logo">
            <img src="logo.png" alt="TexGo Logo">
        </div>

        <!-- Bloque de Información Alineado a la Izquierda -->
        <div class="info-block">
            <div class="title-container">
                <h1 class="title">MONTENEGRO</h1>
            </div>

            <div class="info-details-card">
                <div class="composition">
                    90% POLIESTER<br>
                    8.5% RAYON / 1.5% SPANDEX
                </div>
                <div class="specs">
                    <span class="spec-text">300 GM2 (+/-5%)</span>
                    <span class="spec-text">150 CM (+/-5%)</span>
                </div>
            </div>
        </div>

        <!-- Botones de Acción Alineados a la Izquierda -->
        <div class="buttons-container">
            <button class="btn-action" onclick="openModal('colorsModal')">COLORES</button>
            <button class="btn-action" onclick="openModal('ideasModal')">IDEAS DE CONFECCIÓN</button>
        </div>

        <!-- Modal 1: Colores (3 - 3 - 1) -->
        <div class="modal" id="colorsModal">
            <h2 class="modal-title">COLORES DISPONIBLES</h2>
            <div class="colors-grid">
                <!-- Fila 1 -->
                <div class="color-card">
                    <div class="color-box" style="background-color: #fcfcfa;"></div>
                    <div class="color-name">MARFIL</div>
                </div>
                <div class="color-card">
                    <div class="color-box" style="background-color: #e8e8dc;"></div>
                    <div class="color-name">CREMA</div>
                </div>
                <div class="color-card">
                    <div class="color-box" style="background-color: #87867e;"></div>
                    <div class="color-name">DARK SAND</div>
                </div>

                <!-- Fila 2 -->
                <div class="color-card">
                    <div class="color-box" style="background-color: #5c473e;"></div>
                    <div class="color-name">MOCHA MOUSE</div>
                </div>
                <div class="color-card">
                    <div class="color-box" style="background-color: #241f1d;"></div>
                    <div class="color-name">CAFÉ</div>
                </div>
                <div class="color-card">
                    <div class="color-box" style="background-color: #422020;"></div>
                    <div class="color-name">VINOTINTO</div>
                </div>

                <!-- Fila 3 (Centrada al medio) -->
                <div class="color-card color-center">
                    <div class="color-box" style="background-color: #000000;"></div>
                    <div class="color-name">NEGRO</div>
                </div>
            </div>
            <button class="btn-close" onclick="closeModal('colorsModal')">CERRAR</button>
        </div>

        <!-- Modal 2: Ideas de Confección -->
        <div class="modal" id="ideasModal">
            <h2 class="modal-title">IDEAS DE CONFECCIÓN</h2>
            <div class="outfits-grid">
                
                <!-- Outfit 1: Vinotinto -->
                <div class="outfit-card">
                    <img src="outfit1.jpg" alt="Confección Outfit Vinotinto">
                    <div class="badge-editorial" style="top: 5%; right: 1.5%;">VINOTINTO</div>
                    <svg class="pointer-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                        <polyline points="88,7 88,38 62,38" />
                        <circle cx="62" cy="38" r="0.6" />
                    </svg>
                </div>

                <!-- Outfit 2: Crema -->
                <div class="outfit-card outfit-2">
                    <img src="outfit2.jpg" alt="Confección Outfit Beige">
                    <div class="badge-editorial" style="top: 74%; left: 5%;">CREMA</div>
                    <svg class="pointer-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                        <polyline points="28,76 28,64 48,64" />
                        <circle cx="48" cy="64" r="0.6" />
                    </svg>
                </div>

                <!-- Outfit 3: Marfil -->
                <div class="outfit-card outfit-3">
                    <img src="outfit3.jpg" alt="Confección Outfit Blanco Jeans">
                    <div class="badge-editorial" style="top: 14%; left: 5%;">MARFIL</div>
                    <svg class="pointer-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                        <polyline points="28,16 28,28 38,28" />
                        <circle cx="38" cy="28" r="0.6" />
                    </svg>
                </div>

            </div>
            <button class="btn-close" onclick="closeModal('ideasModal')">CERRAR</button>
        </div>

    </div>

    <script>
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
    </script>

</body>
</html>
