<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COCOA - TexGo Colombia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Playfair Display', 'Times New Roman', serif;
        }

        /* Contenedor del Póster (Proporción exacta) */
        .poster {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 1 / 1.37;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        /* 1. Logo TG (Esquina superior izquierda) */
        .logo {
            position: absolute;
            top: 3.5%;
            left: 3.5%;
            width: 18%;
            z-index: 10;
            mix-blend-mode: multiply;
            opacity: 0.85;
        }

        .logo img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 2. Modelo (Alineada a la izquierda abajo) */
        .model {
            position: absolute;
            left: 11.5%;
            bottom: 0;
            height: 82%;
            z-index: 5;
            pointer-events: none;
        }

        .model img {
            height: 100%;
            width: auto;
            display: block;
            object-fit: contain;
            object-position: bottom left;
        }

        /* 3. Título COCOA (Con el punto a la izquierda) */
        .title-container {
            position: absolute;
            top: 8.5%;
            right: 11%;
            z-index: 10;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .dot {
            width: 7px;
            height: 7px;
            background-color: #ffffff;
            border-radius: 50%;
            margin-top: 18px;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 6.8vw, 5.2rem);
            font-weight: 500;
            letter-spacing: 0.05em;
            color: #050505;
            line-height: 0.9;
        }

        /* 4. Especificaciones (260 GM2 | 140 CM) */
        .specs {
            position: absolute;
            top: 21.5%;
            right: 10%;
            z-index: 10;
            display: flex;
            gap: 1.8rem;
        }

        .spec-text {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.2rem, 3.2vw, 2.5rem);
            font-weight: 400;
            color: #0a0a0a;
            letter-spacing: 0.02em;
        }

        /* 5. Franja Lateral de Colores PANTONE® */
        .pantone-bar {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 10.2%;
            z-index: 20;
            display: flex;
            flex-direction: column;
        }

        .pantone-item {
            flex: 1;
            position: relative;
            width: 100%;
        }

        .pantone-label {
            position: absolute;
            bottom: 3px;
            right: 4px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: clamp(0.35rem, 0.6vw, 0.55rem);
            font-weight: 800;
            color: #000000;
            letter-spacing: 0.02em;
            user-select: none;
        }

        /* Ajustes específicos de texto en la muestra negra */
        .pantone-item.dark .pantone-label {
            color: #ffffff;
        }

        /* Responsive para móviles */
        @media (max-width: 600px) {
            body {
                padding: 0;
            }
            .poster {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <div class="poster">
        <!-- Logo TG -->
        <div class="logo">
            <img src="logo.png" alt="TG Logo">
        </div>

        <!-- Modelo -->
        <div class="model">
            <img src="model.png" alt="Modelo Cocoa">
        </div>

        <!-- Título COCOA -->
        <div class="title-container">
            <div class="dot"></div>
            <h1 class="title">COCOA</h1>
        </div>

        <!-- Especificaciones -->
        <div class="specs">
            <span class="spec-text">260 GM2</span>
            <span class="spec-text">140 CM</span>
        </div>

        <!-- Barra de Colores Pantone -->
        <div class="pantone-bar">
            <div class="pantone-item" style="background-color: #FAF6EE;">
                <span class="pantone-label">PANTONE®</span>
            </div>
            <div class="pantone-item" style="background-color: #EBD39B;">
                <span class="pantone-label">PANTONE®</span>
            </div>
            <div class="pantone-item" style="background-color: #CCA887;">
                <span class="pantone-label">PANTONE®</span>
            </div>
            <div class="pantone-item" style="background-color: #CBE3EB;">
                <span class="pantone-label">PANTONE®</span>
            </div>
            <div class="pantone-item" style="background-color: #D1E4CF;">
                <span class="pantone-label">PANTONE®</span>
            </div>
            <div class="pantone-item" style="background-color: #DCD3E7;">
                <span class="pantone-label">PANTONE®</span>
            </div>
            <div class="pantone-item" style="background-color: #71242C;">
                <span class="pantone-label">PANTONE®</span>
            </div>
            <div class="pantone-item" style="background-color: #553930;">
                <span class="pantone-label">PANTONE®</span>
            </div>
            <div class="pantone-item dark" style="background-color: #0A0A0A;">
                <span class="pantone-label">PANTONE®</span>
            </div>
        </div>
    </div>

</body>
</html>
