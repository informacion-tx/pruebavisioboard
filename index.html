<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COCOA - TexGo Colombia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d0d;
            color: #1a1a1a;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .board-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 1 / 1.414; /* Proporción póster vertical A4 */
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            display: flex;
        }

        /* Capa de contraste suave */
        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(0,0,0,0.1) 100%);
            pointer-events: none;
        }

        /* Logo TexGo en esquina superior izquierda */
        .logo-container {
            position: absolute;
            top: 4%;
            left: 4%;
            z-index: 10;
            width: 18%;
            max-width: 140px;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.3));
        }

        /* Tipografía e Información Central/Derecha */
        .header-info {
            position: absolute;
            top: 7%;
            right: 18%;
            z-index: 10;
            text-align: right;
            user-select: none;
        }

        .main-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 7.5vw, 6rem);
            font-weight: 500;
            letter-spacing: 0.08em;
            color: #0b0b0b;
            line-height: 1;
            margin-bottom: 25px;
            text-shadow: 0 1px 2px rgba(255,255,255,0.4);
        }

        .specs-row {
            display: flex;
            gap: 2rem;
            justify-content: flex-end;
            align-items: center;
        }

        .spec-item {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.1rem, 2.8vw, 2.2rem);
            font-weight: 400;
            color: #111111;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        /* Imagen de la Modelo (Recortada sin fondo) */
        .model-container {
            position: absolute;
            bottom: 0;
            left: 8%;
            height: 86%;
            z-index: 5;
            pointer-events: none;
        }

        .model-container img {
            height: 100%;
            width: auto;
            object-fit: contain;
            object-position: bottom left;
            filter: drop-shadow(5px 10px 15px rgba(0, 0, 0, 0.4));
        }

        /* Barra Lateral de Colores PANTONE® */
        .pantone-sidebar {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 13%;
            min-width: 85px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            box-shadow: -2px 0 15px rgba(0,0,0,0.15);
        }

        .pantone-swatch {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
            overflow: hidden;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .pantone-swatch:hover {
            transform: translateX(-4px);
            z-index: 20;
            filter: brightness(1.05);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .swatch-color {
            width: 100%;
            height: 72%;
        }

        .swatch-label {
            height: 28%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px 4px;
        }

        .swatch-label span {
            font-size: clamp(0.45rem, 0.75vw, 0.65rem);
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #000000;
        }

        /* Adaptación Responsive para Móviles */
        @media (max-width: 600px) {
            body {
                padding: 0;
            }
            .board-container {
                box-shadow: none;
            }
            .header-info {
                right: 16%;
                top: 5%;
            }
            .specs-row {
                gap: 0.8rem;
            }
            .pantone-sidebar {
                width: 15%;
                min-width: 55px;
            }
            .swatch-label span {
                font-size: 0.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="board-container">
        <div class="overlay"></div>

        <!-- Logo -->
        <div class="logo-container">
            <img src="logo.png" alt="TexGo Colombia Logo">
        </div>

        <!-- Encabezado y Especificaciones -->
        <div class="header-info">
            <h1 class="main-title">COCOA</h1>
            <div class="specs-row">
                <span class="spec-item">260 GM2</span>
                <span class="spec-item">140 CM</span>
            </div>
        </div>

        <!-- Modelo -->
        <div class="model-container">
            <img src="model.png" alt="Modelo Femenina Traje Cocoa">
        </div>

        <!-- Barra de Colores Pantone -->
        <div class="pantone-sidebar">
            <div class="pantone-swatch" title="Marfil / Crema">
                <div class="swatch-color" style="background-color: #f7f4e9;"></div>
                <div class="swatch-label"><span>PANTONE®</span></div>
            </div>
            <div class="pantone-swatch" title="Arena / Beige Claro">
                <div class="swatch-color" style="background-color: #ebd399;"></div>
                <div class="swatch-label"><span>PANTONE®</span></div>
            </div>
            <div class="pantone-swatch" title="Marrón Claro / Camel">
                <div class="swatch-color" style="background-color: #cca885;"></div>
                <div class="swatch-label"><span>PANTONE®</span></div>
            </div>
            <div class="pantone-swatch" title="Azul Pastel / Celeste Gray">
                <div class="swatch-color" style="background-color: #cbe3eb;"></div>
                <div class="swatch-label"><span>PANTONE®</span></div>
            </div>
            <div class="pantone-swatch" title="Menta Suave">
                <div class="swatch-color" style="background-color: #d1e4cf;"></div>
                <div class="swatch-label"><span>PANTONE®</span></div>
            </div>
            <div class="pantone-swatch" title="Lila / Lavanda">
                <div class="swatch-color" style="background-color: #dcd3e7;"></div>
                <div class="swatch-label"><span>PANTONE®</span></div>
            </div>
            <div class="pantone-swatch" title="Borgoña / Tinto">
                <div class="swatch-color" style="background-color: #71242c;"></div>
                <div class="swatch-label"><span>PANTONE®</span></div>
            </div>
            <div class="pantone-swatch" title="Marrón Chocolate / Cocoa">
                <div class="swatch-color" style="background-color: #553930;"></div>
                <div class="swatch-label"><span>PANTONE®</span></div>
            </div>
            <div class="pantone-swatch" title="Negro Profundo">
                <div class="swatch-color" style="background-color: #0a0a0a;"></div>
                <div class="swatch-label"><span>PANTONE®</span></div>
            </div>
        </div>
    </div>

</body>
</html>
